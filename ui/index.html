<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Travel Agent - Test UI</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 12px; }
  header { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .pill { background: #eef; border-radius: 12px; padding: 2px 10px; font-size: 13px; }
  #log { border: 1px solid #ccc; border-radius: 6px; height: 420px; overflow-y: auto; padding: 8px; margin: 12px 0; }
  .msg { white-space: pre-wrap; margin: 6px 0; padding: 6px 10px; border-radius: 6px; }
  .user { background: #e8f0fe; } .agent { background: #f4f4f4; } .err { background: #fde8e8; }
  form { display: flex; gap: 8px; } input[type=text] { flex: 1; padding: 8px; }
  .quick button { margin: 2px; }
</style>
</head>
<body>
<h2>Travel Agent - Test UI</h2>
<header>
  <label><input type="checkbox" id="demo"> Demo mode (canned data, no LLM/API/Calendar calls)</label>
  <span class="pill">Status: <b id="status">running</b></span>
  <span class="pill">LLM calls this server run: <b id="calls">0</b></span>
  <button id="new">New session</button>
</header>
<div id="log"></div>
<div class="quick" id="quick"></div>
<form id="form">
  <input type="text" id="msg" placeholder="e.g. Plan a trip from Delhi to Goa this weekend" autocomplete="off">
  <button id="send">Send</button>
</form>
<script>
let sid = null;
const $ = id => document.getElementById(id);
const quick = ["Plan a trip from Delhi to Goa this weekend", "I'm busy that weekend: Delhi to Goa trip",
               "edit: direct flights only", "confirm", "cancel"];
quick.forEach(q => { const b = document.createElement("button"); b.textContent = q; b.type = "button";
  b.onclick = () => send(q); $("quick").appendChild(b); });

function add(text, cls) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = $("log").scrollHeight;
}
async function send(text) {
  if (!text) return;
  add(text, "user"); $("msg").value = ""; $("send").disabled = true;
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ message: text, session_id: sid, demo: $("demo").checked }) });
    const j = await r.json();
    if (j.session_id) sid = j.session_id;
    add(j.reply || j.error, j.error ? "err" : "agent");
    if (j.status) $("status").textContent = j.status;
    if (j.llm_calls !== undefined) $("calls").textContent = j.llm_calls;
  } catch (e) { add("Network error: " + e, "err"); }
  $("send").disabled = false; $("msg").focus();
}
$("form").onsubmit = e => { e.preventDefault(); send($("msg").value.trim()); };
$("new").onclick = () => { sid = null; $("status").textContent = "running"; $("log").innerHTML = ""; };
fetch("/api/state").then(r => r.json()).then(j => $("calls").textContent = j.llm_calls);
</script>
</body>
</html>
